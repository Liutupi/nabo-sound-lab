<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NABO · 三个新声音玩法</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0a0716;color:#ece8ff}body{margin:24px auto;max-width:930px;padding:0 20px}h1{font-size:24px;margin:8px 0}p{line-height:1.6;color:#b9b0d5}button,a,select,input{font:inherit}button,a.tab{border:1px solid #65558c;border-radius:10px;background:#151030;color:inherit;padding:10px 16px;cursor:pointer;text-decoration:none}button:hover{border-color:#35f0dc}nav,.controls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.layout{display:flex;gap:30px;align-items:flex-start}canvas{width:360px;height:480px;max-width:100%;background:#0a0716;border:1px solid #65558c;border-radius:12px;image-rendering:pixelated;touch-action:none}.side{flex:1;min-width:260px}.controls button{flex:1;font-size:20px;touch-action:none;user-select:none}.status{min-height:48px;color:#35f0dc}.small{font-size:14px}label{display:block;margin:14px 0}input[type=range]{width:100%}@media(max-width:700px){.layout{flex-direction:column}canvas{width:300px;height:400px}.side{width:100%}}
</style>
<h1>NABO 音乐人 · 三个新声音玩法</h1><p>打开麦克风后可以直接玩。方向上、下和空格对应工牌三键；双击上键返回选择。采样只保留在本页内存中，离开玩法即释放。</p>
<nav><button data-game="flight">哼歌飞行</button><button data-game="clap">拍手节奏</button><button data-game="sampler">采样琴</button><a class="tab" href="index.html?screen=menu">← 返回声音实验室主菜单</a></nav>
<div class="layout"><div><canvas id="lcd" width="240" height="320" aria-label="240×320游戏画面"></canvas><div class="controls"><button data-key="0">▲</button><button data-key="1">▼</button><button data-key="2">OK</button></div></div><div class="side"><button id="mic">启用麦克风</button><p id="micstate" class="status">尚未启用麦克风</p><p id="help"></p><button id="clap-test">拍一下（C键测试判定）</button><label><input type="checkbox" id="demo"> 使用模拟音高输入（只用于检查规则）</label><label>模拟音高：<span id="pitchval">C4</span><input id="pitch" type="range" min="48" max="84" value="60" step=".1"></label><p class="small">飞行：先哼舒适音再按OK，唱高向上、唱低向下，穿12道门。节奏：先听四拍，再对光圈拍16次；正式回合不外放节拍声，避免扬声器触发麦克风。采样琴：按住OK超过350毫秒录音，最多半秒；轻按▲/▼/OK演奏原音、+4、+7半音。</p></div></div>
<script src="new-games-model.js"></script><script>
'use strict';
const $=s=>document.querySelector(s),canvas=$('#lcd'),ctx=canvas.getContext('2d'),BG='#0a0716',CYAN='#35f0dc',MAG='#ff3da6',GOLD='#ffc94a',DIM='#b0a3d0';
const images={};for(const id of ['S-FLOAT','S-DRUM','S-GUITAR-IDLE','S-GUITAR-STRUM']){const im=new Image();im.src='../game-art/soundlab/grok-start/cutouts/'+id+'.png';images[id]=im;}
let game='menu',flight,bpm=96,difficulty=0,clap,clapOrigin=0,clapFeedback='',feedbackAt=0,lastNow=performance.now(),lastUp=-1000;
let audio,analyser,processor,micStream,midi100=6000,voice=false,db=-140,realMidi=0,sample=null,sampleSource=null,held=false,holdAt=0,recording=false,recordedThisHold=false,recordData,recordN=0,recPhase=0,recSum=0,recCount=0,note=-1,noteAt=0;
const noteName=m=>{m=Math.round(m);return['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][(m%12+12)%12]+(Math.floor(m/12)-1);};
function text(s,x,y,size=16,color='#ece8ff',align='center'){ctx.fillStyle=color;ctx.font=`${size}px system-ui,sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}function avatar(id,x,y,size=76){const im=images[id];if(im.complete&&im.naturalWidth)ctx.drawImage(im,x-size/2,y-size/2,size,size);}
function header(s,mode=''){rect(0,0,240,26,'#151030');text(s,8,13,18,'#ece8ff','left');text(mode,232,13,14,CYAN,'right');}
function footer(s){rect(0,260,240,60,'#151030');text(s,120,276);text('▲▲ 返回',120,306,16,DIM);}
function setGame(id){game=id;held=recording=false;stopSample();sample=recordData=null;recordN=0;lastUp=-1000;if(id==='flight')flight=new NewGames.Flight(20261023,difficulty);if(id==='clap')clap=new NewGames.Clap(bpm);$('#help').textContent={flight:'先哼一个舒适的音，再按OK校准并开始；▲换难度，▼重来。',clap:'OK开始；▲切换96/120/144 BPM，▼回准备。C键/拍一下按钮可独立检查判定。',sampler:'按住OK录半秒，松开结束；轻按三键弹奏。进入别的玩法后会清除录音。',menu:'点击上方选择一个声音玩法。'}[id];}
function audioContext(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume();return audio;}
function click(at,accent){const a=audioContext(),o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=accent?1760:1320;g.gain.setValueAtTime(.08,at);g.gain.linearRampToValueAtTime(0,at+.025);o.connect(g).connect(a.destination);o.start(at);o.stop(at+.026);}
function stopSample(){if(sampleSource){try{sampleSource.stop();}catch{}sampleSource=null;}}
function playNote(k){if(!sample){$('#micstate').textContent='先按住OK采样';return;}stopSample();const a=audioContext(),b=a.createBuffer(1,sample.length,8000);b.copyToChannel(sample,0);const s=a.createBufferSource(),g=a.createGain();s.buffer=b;s.playbackRate.value=[1,2**(4/12),2**(7/12)][k];const dur=sample.length/8000/s.playbackRate.value;g.gain.setValueAtTime(0,a.currentTime);g.gain.linearRampToValueAtTime(.65,a.currentTime+.004);g.gain.setValueAtTime(.65,a.currentTime+Math.max(.004,dur-.004));g.gain.linearRampToValueAtTime(0,a.currentTime+dur);s.connect(g).connect(a.destination);s.start();sampleSource=s;note=k;noteAt=performance.now();s.onended=()=>{if(sampleSource===s)sampleSource=null;};}
function beginRecording(){if(!micStream){$('#micstate').textContent='请先启用麦克风';recordedThisHold=true;return;}stopSample();recordData=new Float32Array(4000);recordN=recPhase=recSum=recCount=0;recording=recordedThisHold=true;}
function endRecording(){recording=false;if(recordN<320){sample=null;$('#micstate').textContent='声音太短，请重录';return;}const raw=recordData.subarray(0,recordN),peak=raw.reduce((m,v)=>Math.max(m,Math.abs(v)),0);if(peak<64/32768){sample=null;$('#micstate').textContent='声音太轻，请重录';return;}const gain=Math.min(4,Math.max(.125,12000/(peak*32768)));sample=Float32Array.from(raw,v=>Math.max(-.55,Math.min(.55,v*gain)));$('#micstate').textContent=`采样完成 ${Math.round(sample.length/8)} ms；三键演奏`;} 
async function enableMic(){try{const a=audioContext();micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});const src=a.createMediaStreamSource(micStream);analyser=a.createAnalyser();analyser.fftSize=2048;src.connect(analyser);processor=a.createScriptProcessor(1024,1,1);const mute=a.createGain();mute.gain.value=0;src.connect(processor);processor.connect(mute).connect(a.destination);let rmsPrev=0,lastOnset=-1000;processor.onaudioprocess=e=>{const x=e.inputBuffer.getChannelData(0);let power=0;for(const v of x)power+=v*v;const rms=Math.sqrt(power/x.length);db=20*Math.log10(Math.max(rms,1e-7));const now=performance.now();if(rms>.015&&rms>rmsPrev*1.9&&now-lastOnset>160&&game==='clap'){clapHit(now-45);lastOnset=now;}rmsPrev=rms*.6+rmsPrev*.4;if(recording){for(const v of x){recSum+=v;recCount++;recPhase+=8000;if(recPhase>=a.sampleRate){recPhase-=a.sampleRate;recordData[recordN++]=recSum/recCount;recSum=recCount=0;if(recordN===4000){endRecording();break;}}}}};$('#micstate').textContent='麦克风已启用；录音只在本地内存';}catch(e){$('#micstate').textContent='无法启用麦克风：'+e.message;}}
$('#mic').onclick=enableMic;
function readPitch(){if($('#demo').checked){midi100=Math.round(Number($('#pitch').value)*100);voice=true;return;}if(!analyser){voice=false;return;}const x=new Float32Array(2048);analyser.getFloatTimeDomainData(x);let sum=0;for(const v of x)sum+=v*v;if(sum/x.length<.000015){voice=false;return;}const sr=audio.sampleRate;let best=0,bestLag=0,before=-1,previous=-1;for(let lag=Math.floor(sr/800);lag<Math.min(1000,Math.floor(sr/70));lag++){let d=0,e=0;for(let j=0;j<1024;j++){d+=x[j]*x[j+lag];e+=x[j]*x[j]+x[j+lag]*x[j+lag];}const corr=e?2*d/e:0;if(previous>before&&previous>=corr&&previous>.8){best=previous;bestLag=lag-1;break;}before=previous;previous=corr;}voice=best>.8;if(voice){realMidi=69+12*Math.log2(sr/bestLag/440);midi100=Math.round(realMidi*100);}}
function clapHit(now=performance.now()){if(game!=='clap'||clap.state!==1)return;const result=clap.hit(Math.round(now-clapOrigin));if(result){clapFeedback=result===2?'精准':result===1?'命中':'多拍了';feedbackAt=performance.now();}}
function key(k,down){const now=performance.now();if(game==='menu')return;if(game==='sampler'){if(k===2){if(down){if(held)return;held=true;holdAt=now;recordedThisHold=false;}else if(held){held=false;if(recording)endRecording();else if(!recordedThisHold)playNote(2);}return;}if(!down)return;if(k===0){if(now-lastUp<300){setGame('menu');return;}lastUp=now;playNote(0);}else playNote(1);return;}if(!down)return;if(k===0&&now-lastUp<300){setGame('menu');return;}if(k===0)lastUp=now;if(game==='flight'){if(k===0&&flight.state!==1){difficulty=(difficulty+1)%3;flight=new NewGames.Flight(20261023,difficulty);}if(k===1)flight=new NewGames.Flight(20261023,difficulty);if(k===2){if(flight.state===1)flight.state=2;else if(flight.state===2)flight.state=1;else if(voice){if(flight.state!==0)flight=new NewGames.Flight(20261023,difficulty);flight.start(midi100);}else $('#micstate').textContent='先哼一个音，再按OK';}}else if(game==='clap'){if(k===0&&clap.state!==1){bpm=bpm===96?120:bpm===120?144:96;clap=new NewGames.Clap(bpm);}if(k===1)clap=new NewGames.Clap(bpm);if(k===2){clap=new NewGames.Clap(bpm);clap.start();clapOrigin=now;const a=audioContext();for(let i=0;i<4;i++)click(a.currentTime+i*clap.period/1000,i===0);}}}
document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>setGame(b.dataset.game));document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);key(+b.dataset.key,true);};b.onpointerup=b.onpointercancel=e=>{e.preventDefault();key(+b.dataset.key,false);};b.onclick=e=>{if(e.detail===0){key(+b.dataset.key,true);key(+b.dataset.key,false);}};});const keys={ArrowUp:0,ArrowDown:1,' ':2};window.onkeydown=e=>{if(e.code==='KeyC'){if(!e.repeat)clapHit();return;}if(e.key in keys&&!e.repeat){e.preventDefault();key(keys[e.key],true);}};window.onkeyup=e=>{if(e.key in keys){e.preventDefault();key(keys[e.key],false);}};window.onblur=()=>{if(held)key(2,false);};$('#clap-test').onclick=()=>clapHit();$('#pitch').oninput=()=>$('#pitchval').textContent=noteName(+$('#pitch').value);
function draw(now){rect(0,0,240,320,BG);if(game==='menu'){header('三个声音玩法');['哼歌飞行','拍手节奏','采样琴'].forEach((s,i)=>text(s,120,85+i*60,22,[CYAN,MAG,GOLD][i]));text('点击上方选择',120,284,16,DIM);return;}if(game==='flight'){header('哼歌飞行',['轻松','标准','挑战'][difficulty]);text('得分 '+flight.score,10,43,16,GOLD,'left');text('生命 '+flight.lives,230,43,16,MAG,'right');ctx.save();ctx.beginPath();ctx.rect(0,60,240,190);ctx.clip();for(const g of flight.gate){const x=Math.trunc(g.xq/256),a=g.y-flight.gap()/2,b=a+flight.gap();rect(x,60,16,a-60,'#8a5cff');rect(x,b,16,250-b,'#8a5cff');rect(x,a-3,16,3,CYAN);rect(x,b,16,3,CYAN);}avatar('S-FLOAT',54,flight.yq/256);ctx.restore();if(flight.state!==1){rect(8,100,224,112,'#151030');text(flight.state===0?'哼一个舒服的音':flight.state===2?'已暂停':flight.state===4?'飞行完成':'再试一次',120,124,20);text(flight.state===0?'高音向上，低音向下':`穿门 ${flight.cleared} / 12`,120,160,16,CYAN);}else if(!voice)text('继续哼唱',120,240,16,GOLD);footer(flight.state===1?'OK 暂停  ▼ 重来':'▲ 难度  OK 开始');}else if(game==='clap'){header('拍手节奏',bpm+' BPM');const t=clap.state===1?Math.round(now-clapOrigin):clap.now,first=4*clap.period;if(clap.state===0){text('跟着节拍拍手',120,61,22);text('先听四拍，再跟光圈',120,99,16,CYAN);text('每拍一次，共16拍',120,127,16,DIM);}else if(clap.state===3){text('得分 '+clap.score,120,59,24);text(`命中 ${clap.hits} / 16`,120,97,16,CYAN);text(`精准 ${clap.perfect}  连击 ${clap.best_combo}`,120,123,16,GOLD);text(`漏拍 ${clap.misses}  多拍 ${clap.extra}`,120,149,16,DIM);}else if(t<first){text('预备，听四拍',120,60);text(4-Math.trunc(t/clap.period),120,116,48,GOLD);}else{text(`第 ${Math.min(clap.judged+1,16)} / 16 拍`,120,51,16,CYAN);const ph=(t-first)%clap.period,d=Math.min(ph,clap.period-ph);ctx.strokeStyle='#8a5cff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(120,132,20+d*40/(clap.period/2),0,Math.PI*2);ctx.stroke();ctx.strokeStyle=d<=120?CYAN:DIM;ctx.beginPath();ctx.arc(120,132,20,0,Math.PI*2);ctx.stroke();text('得分 '+clap.score,157,208,16,GOLD);text('连击 '+clap.combo,157,236,16,CYAN);if(now-feedbackAt<420)text(clapFeedback,120,132,18,CYAN);}avatar('S-DRUM',clap.state===1&&t>=first?40:120,222);footer(clap.state===1?'跟光圈拍手  OK 重开':'▲ 速度  OK 开始');}else{header('采样琴','SAMPLER');text(recording?'录音中，请发一个声音':sample?'把你的声音弹成旋律':'按住OK，录半秒声音',120,53);text('采样 '+Math.round((sample?sample.length:recordN)/8)+' ms / 500 ms',120,88,16,DIM);if(recording)rect(20,107,recordN*200/4000,8,MAG);avatar(sampleSource?'S-GUITAR-STRUM':'S-GUITAR-IDLE',120,150);['▲ 原音','▼ +4','OK +7'].forEach((s,i)=>{rect(8+i*76,202,72,44,note===i&&now-noteAt<220?'#63501a':'#151030');text(s,44+i*76,224);});footer('轻按三键弹  按住OK录');}}
let pitchAt=0;function frame(now){const dt=Math.min(1000,Math.max(0,Math.round(now-lastNow)));lastNow=now;if(now-pitchAt>40){readPitch();pitchAt=now;}if(game==='flight')flight.step(dt,midi100,voice);if(game==='clap')clap.step(Math.round(now-clapOrigin)-45);if(game==='sampler'&&held&&!recordedThisHold&&now-holdAt>=350)beginRecording();draw(now);requestAnimationFrame(frame);}setGame(new URLSearchParams(location.search).get('game')||'menu');requestAnimationFrame(frame);
window.newGamesDebug={select:setGame,key,clapHit,get state(){return{game,flight:flight?.snapshot(),clap:clap?.snapshot(),sampleLength:sample?.length||0,recording};}};
</script></html>
